[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-buying-advisor"
version = "0.2.0"
description = "media-buying-advisor - model, tests, reproducible figures and paper"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Humbert Pou Plana"}]
dependencies = [
  "numpy",
  "matplotlib"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: re-trains the whole pipeline"]
